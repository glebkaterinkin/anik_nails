
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anik Nails</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #1e1e1e;
  --surface: #2a2a2a;
  --line: #3a3a3a;
  --text: #f3ecee;
  --muted: #a9a1a4;
  --pink: #f0aecb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Jost", sans-serif;
  font-weight: 300;
  line-height: 1.5;
}

.wrap {
  max-width: 960px;
  margin: auto;
  padding: 0 20px;
}

header {
  text-align: center;
  padding: 40px 0 28px;
}

header img {
  width: 168px;
  height: 168px;
  object-fit: contain;
  display: block;
  margin: 0 auto 18px;
  border-radius: 50%;
}

h1 {
  margin: 0;
  font-weight: 300;
  font-size: clamp(2rem, 8vw, 3rem);
  letter-spacing: .14em;
}

.gallery {
  columns: 2;
  column-gap: 10px;
  padding-bottom: 56px;
}

.gallery img {
  width: 100%;
  display: block;
  margin-bottom: 10px;
  border-radius: 14px;
  break-inside: avoid;
  background: var(--surface);
}

@media (min-width: 720px) {
  .gallery {
    columns: 3;
    column-gap: 14px;
  }

  .gallery img {
    margin-bottom: 14px;
  }
}

footer {
  border-top: 1px solid var(--line);
  padding: 40px 0 56px;
  text-align: center;
}

.note {
  max-width: 30rem;
  margin: 0 auto 28px;
  padding: 18px 20px;
  border: 1px solid var(--pink);
  border-radius: 14px;
  font-size: 1.05rem;
  font-weight: 400;
}

.note b {
  color: var(--pink);
}

.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 22rem;
  margin: 0 auto 32px;
}

.btn {
  display: block;
  padding: 15px 20px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 1.05rem;
  font-weight: 500;
  text-align: center;
  border: 1px solid var(--pink);
  color: var(--pink);
  transition: .2s;
}

.btn.main {
  background: var(--pink);
  color: var(--bg);
}

.btn:hover {
  background: var(--pink);
  color: var(--bg);
}

address {
  font-style: normal;
  color: var(--muted);
  font-size: 1.05rem;
}

address strong {
  display: block;
  color: var(--text);
  font-weight: 400;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <img src="images/logo.jpg" alt="Логотип Anik Nails">
  <h1>Anik Nails</h1>
</header>

<main class="gallery" aria-label="Примеры работ">
  <img src="images/1.jpg" alt="Французский маникюр" loading="lazy">
  <img src="images/2.jpg" alt="Синий маникюр" loading="lazy">
  <img src="images/3.jpg" alt="Малиновый маникюр" loading="lazy">
  <img src="images/4.jpg" alt="Зелёный маникюр" loading="lazy">
  <img src="images/5.jpg" alt="Нюдовый маникюр" loading="lazy">
  <img src="images/6.jpg" alt="Розовый маникюр" loading="lazy">
  <img src="images/7.jpg" alt="Голубой френч" loading="lazy">
  <img src="images/8.jpg" alt="Маникюр с рисунком" loading="lazy">
  <img src="images/9.jpg" alt="Нежный маникюр" loading="lazy">
  <img src="images/10.jpg" alt="Маникюр с цветами" loading="lazy">
</main>

<footer>

  <p class="note">
    <b>Сначала запишитесь.</b>
    Если заявку одобрят, вам назначат день — тогда приходите.
  </p>

  <nav class="links">

    <a class="btn main"
       href="https://dikidi.ru/448341"
       target="_blank"
       rel="noopener noreferrer">
      Записаться на Dikidi
    </a>

    <a class="btn"
       href="https://vk.ru/aniknails"
       target="_blank"
       rel="noopener noreferrer">
      ВКонтакте
    </a>

    <a class="btn"
       href="https://www.instagram.com/anik_nails"
       target="_blank"
       rel="noopener noreferrer">
      Instagram
    </a>

  </nav>

  <address>
    <strong>Адрес</strong>
    Ленина, 19, офис 202
  </address>

</footer>

</div>

</body>
</html>
